services:
  - type: web
    name: ss-granada
    env: static
    region: frankfurt
    plan: free
    # Export 100% estático de Next.js (`output: 'export'` en next.config.js):
    # sin servidor Node, sin API routes, ISR ni middleware. Los datos viven en
    # el bundle y la PWA funciona offline-first (next-pwa).
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    routes:
      # SPA fallback: todas las rutas sirven su index.html (trailingSlash).
      - type: rewrite
        source: /*
        destination: /index.html
