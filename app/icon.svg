<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon institucional SS Málaga: cruz de nazareno dorada sobre púrpura -->
  <defs>
    <linearGradient id="dorado" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C86A"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A8842B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#4A154B"/>
  <!-- halo de luz -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#D4AF37" stroke-opacity="0.15" stroke-width="1"/>
  <!-- cruz de guía con brazos rematados (estilo nazareno) -->
  <g fill="url(#dorado)">
    <rect x="28.5" y="12" width="7" height="40" rx="2"/>
    <rect x="12" y="22" width="40" height="7" rx="2"/>
    <circle cx="32" cy="32" r="4.2" fill="#4A154B"/>
    <circle cx="32" cy="32" r="2.6"/>
    <circle cx="16" cy="25.5" r="3"/>
    <circle cx="48" cy="25.5" r="3"/>
    <circle cx="32" cy="15" r="3"/>
    <circle cx="32" cy="49" r="3"/>
  </g>
</svg>
